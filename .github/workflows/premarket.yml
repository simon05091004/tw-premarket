name: 台股盤前分析

on:
  schedule:
    # GitHub Actions 用 UTC。台北 06:45 = UTC 22:45（前一天）
    # 排程常延遲 5-15 分鐘，所以提前觸發，目標 07:00 前完成
    - cron: "38 22 * * 0-4"   # UTC 週日~週四 = 台北週一~週五（避開整點/半點壅塞）
    # 備援：GitHub 高負載時會延遲 schedule，也可能整個丟掉不送 —— 2026-08-27
    # 盤前就是這樣,連一筆 run 記錄都沒有。多排一次，第一次成功的話這次會在
    # 抓資料與 API 之前就結束（見 main.py 的 report_exists 守衛），不花錢。
    - cron: "10 23 * * 0-4"   # 台北 07:10，比開盤早 1 小時 50 分
  workflow_dispatch:           # 允許手動觸發（補跑用）
    inputs:
      target_date:
        description: "目標日期 YYYY-MM-DD（留空=今天）"
        required: false
      force:
        description: "報告已存在也重新產生（會再花一次 API 費用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 整個 job 都用台北時間：commit 訊息的日期也要對，
    # 排程在 UTC 22:45 觸發,只設在單一步驟的話 date 會拿到前一天。
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 測試失敗就中止，不浪費 API 費用去產生一份壞報告
      - name: 跑測試
        run: python -m unittest discover -s tests

      - name: 產生盤前分析
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: |
          # 用陣列組參數：shell 是 bash -e，寫成 [ -n "$x" ] && ARGS=... 的話
          # 條件不成立會讓整個 step 以 exit 1 收場。
          ARGS=()
          if [ -n "${{ inputs.target_date }}" ]; then ARGS+=(--date "${{ inputs.target_date }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python -m premarket.main "${ARGS[@]}"

      - name: 推回 repo
        run: |
          git config user.name  "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          # 先 commit 再 pull：此時 docs/ 已有剛產生的檔案,工作區不乾淨,
          # 在 commit 之前 rebase 會因為 unstaged changes 直接失敗。
          git add docs/
          git diff --staged --quiet || git commit -m "盤前分析 $(date +%Y-%m-%d)"
          git pull --rebase          # 盤後 workflow 也會 commit docs/，先同步免得 push 被拒
          git push

      # LINE 通知。沒設 secret 的人（例如 fork 的人）自動略過，不會讓 workflow 失敗。
      # 用 broadcast 而非 push：不需要知道自己的 userId，發給所有加好友的人即可。
      # skipped 是備援排程那次：報告早就發過了，再廣播一次等於騷擾訂閱者。
      - name: LINE 通知
        if: success() && env.LINE_TOKEN != '' && steps.gen.outputs.skipped != 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          MSG="台股盤前分析 $(date +%m/%d) 已更新
          ${PAGES_URL:-https://github.com/${{ github.repository }}}"
          # 一定要看回應碼：curl 沒加 --fail 的話，LINE 回 401 它照樣 exit 0，
          # step 會標成綠的，通知默默停掉沒有人會發現。
          # 連線失敗時 curl 自己會非零結束，用 || 接住才不會被 bash -e 直接砍掉。
          CODE=$(curl -sS -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$MSG" '{messages:[{type:"text",text:$t}]}')" \
            -o /dev/null -w "%{http_code}") || CODE="000"
          echo "LINE 回應碼 $CODE"
          case "$CODE" in
            2*) ;;
            401|403)
              # 報告已經 commit 並 push 完了，這裡失敗不會少一份報告，只是通知沒送出。
              echo "::error::LINE 權杖無效或已過期，請更新 LINE_CHANNEL_ACCESS_TOKEN secret。報告本身已發布，只有通知沒送出。"
              exit 1 ;;
            *)
              # 5xx／連線問題屬暫時性，標成 warning 就好 —— 不值得為了它把整個 run 變紅。
              echo "::warning::LINE 廣播失敗（HTTP $CODE），可能是暫時性問題。報告本身已發布。"
              ;;
          esac

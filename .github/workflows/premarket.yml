name: 台股盤前分析

on:
  # 主要的觸發來源是外部定時服務（cron-job.org）在台北 06:38 呼叫 workflow_dispatch，
  # 帶 scheduled=true，見 README 第三節。GitHub 自己的排程在這個 repo 天天遲到：
  # 2026-11-12 到 11-18 每一天都晚 4–6 小時（11/18 排 06:38，11:49 才啟動），
  # 兩個備援排程排在同一條隊伍裡，一樣遲到。下面的排程留著當備援：外部服務那次
  # 成功的話，遲到的排程會撞到 report_exists 守衛，在抓資料與 API 之前就結束。
  schedule:
    # GitHub Actions 用 UTC。台北 06:38 = UTC 22:38（前一天）
    - cron: "38 22 * * 0-4"   # UTC 週日~週四 = 台北週一~週五（避開整點/半點壅塞）
    # 備援：GitHub 高負載時會延遲 schedule，也可能整個丟掉不送 —— 2026-08-27
    # 盤前就是這樣,連一筆 run 記錄都沒有。多排一次，第一次成功的話這次會在
    # 抓資料與 API 之前就結束（見 main.py 的 report_exists 守衛），不花錢。
    - cron: "10 23 * * 0-4"   # 台北 07:10，比開盤早 1 小時 50 分
  workflow_dispatch:           # 允許手動觸發（補跑用）
    inputs:
      target_date:
        description: "目標日期 YYYY-MM-DD（留空=今天）"
        required: false
      force:
        description: "報告已存在也重新產生（會再花一次 API 費用）"
        type: boolean
        default: false
      # 外部定時服務專用，手動觸發不要勾。勾了代表「這是一次排程」：
      # 報告已存在時跟排程一樣安靜結束，不會被當成手動補送而重發通知。
      scheduled:
        description: "由外部定時服務觸發（視同排程，手動觸發不要勾）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 整個 job 都用台北時間：commit 訊息的日期也要對，
    # 排程在 UTC 22:45 觸發,只設在單一步驟的話 date 會拿到前一天。
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 測試失敗就中止，不浪費 API 費用去產生一份壞報告
      - name: 跑測試
        run: python -m unittest discover -s tests

      - name: 產生盤前分析
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: |
          # 用陣列組參數：shell 是 bash -e，寫成 [ -n "$x" ] && ARGS=... 的話
          # 條件不成立會讓整個 step 以 exit 1 收場。
          ARGS=()
          if [ -n "${{ inputs.target_date }}" ]; then ARGS+=(--date "${{ inputs.target_date }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python -m premarket.main "${ARGS[@]}"

      - name: 推回 repo
        run: |
          git config user.name  "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          # 先 commit 再 pull：此時 docs/ 已有剛產生的檔案,工作區不乾淨,
          # 在 commit 之前 rebase 會因為 unstaged changes 直接失敗。
          git add docs/
          git diff --staged --quiet || git commit -m "盤前分析 $(date +%Y-%m-%d)"
          git pull --rebase          # 盤後 workflow 也會 commit docs/，先同步免得 push 被拒
          git push

      # LINE 通知。沒設 secret 的人（例如 fork 的人）自動略過，不會讓 workflow 失敗。
      # 用 broadcast 而非 push：不需要知道自己的 userId，發給所有加好友的人即可。
      # skipped 是備援排程那次：報告早就發過了，再廣播一次等於騷擾訂閱者。
      - name: LINE 通知
        if: success() && env.LINE_TOKEN != '' && steps.gen.outputs.skipped != 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          # 日期用報告本身的日期，不是執行當天 —— 補跑舊日期時兩者會差好幾天。
          # 取不到就退回今天（例如 main.py 還沒寫出這個 output 的舊版）。
          D="${{ steps.gen.outputs.report_date }}"
          if [ -n "$D" ]; then WHEN="${D:5:2}/${D:8:2}"; else WHEN="$(date +%m/%d)"; fi
          MSG="台股盤前分析 ${WHEN} 已更新
          ${PAGES_URL:-https://github.com/${{ github.repository }}}"
          # 發送、額度檢查、錯誤處理都在 tools/line_notify.py（三個 workflow 共用）。
          # 權杖失效或本月額度用完時它會讓這個 step 失敗，GitHub 就會寄錯誤信通知你。
          LINE_MESSAGE="$MSG" python -m tools.line_notify

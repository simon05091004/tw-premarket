name: 台股盤後籌碼分析

on:
  schedule:
    # 台北 21:23 = UTC 13:23（同一天）
    # 融資餘額約 21:00 公布，排 21:23 可完整涵蓋
    # 刻意避開整點與半點：GitHub 排程在 :00/:30 最壅塞，
    # 實測延遲 63~143 分鐘，錯開分鐘數通常能縮短排隊時間
    # 若想改跑 16:00（融資會缺）：改成 "0 8 * * 1-5"
    - cron: "23 13 * * 1-5"
    # 備援：GitHub 高負載時會延遲 schedule，也可能整個丟掉不送 —— 2026-08-27
    # 盤前就是這樣,連一筆 run 記錄都沒有。台北 22:17,融資早就公布完,
    # 離午夜還有一段緩衝。第一次成功的話這次會在抓資料與 API 之前就結束
    # （見 main.py 的 report_exists 守衛），不花錢。
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "目標日期 YYYY-MM-DD（留空=今天）"
        required: false
      force:
        description: "報告已存在也重新產生（會再花一次 API 費用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: postmarket
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 測試失敗就中止，不浪費 API 費用去產生一份壞報告
      - name: 跑測試
        run: python -m unittest discover -s tests

      - name: 產生盤後籌碼分析
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          TZ: Asia/Taipei
        run: |
          # 用陣列組參數：shell 是 bash -e，寫成 [ -n "$x" ] && ARGS=... 的話
          # 條件不成立會讓整個 step 以 exit 1 收場。
          ARGS=(--session postmarket)
          if [ -n "${{ inputs.target_date }}" ]; then ARGS+=(--date "${{ inputs.target_date }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python -m premarket.main "${ARGS[@]}"

      - name: 推回 repo
        run: |
          git config user.name  "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          # 先 commit 再 pull：此時 docs/ 已有剛產生的檔案,工作區不乾淨,
          # 在 commit 之前 rebase 會因為 unstaged changes 直接失敗。
          git add docs/
          git diff --staged --quiet || git commit -m "盤後籌碼分析 $(date +%Y-%m-%d)"
          git pull --rebase
          git push

      # LINE 通知。沒設 secret 的人（例如 fork 的人）自動略過，不會讓 workflow 失敗。
      # 用 broadcast 而非 push：不需要知道自己的 userId，發給所有加好友的人即可。
      # skipped 是備援排程那次：報告早就發過了，再廣播一次等於騷擾訂閱者。
      - name: LINE 通知
        if: success() && env.LINE_TOKEN != '' && steps.gen.outputs.skipped != 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          MSG="台股盤後籌碼 $(date +%m/%d) 已更新
          ${PAGES_URL:-https://github.com/${{ github.repository }}}/latest-postmarket.html"
          curl -sS -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg t "$MSG" '{messages:[{type:"text",text:$t}]}')" \
            -o /dev/null -w "LINE 回應碼 %{http_code}\n"

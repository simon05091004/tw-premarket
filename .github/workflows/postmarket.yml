name: 台股盤後籌碼分析

on:
  # 主要的觸發來源是外部定時服務（cron-job.org）在台北 21:23 呼叫 workflow_dispatch，
  # 帶 scheduled=true，見 README 第三節。GitHub 自己的排程在這個 repo 遲到得更嚴重：
  # 11/16、11/17 的盤後分別到隔天 06:55、05:48 才啟動（晚 8.5–9.5 小時）。
  # 下面的排程留著當備援：遲到到隔天清晨的那次，main.py 會把 21:00 前的執行算成
  # 前一個交易日（POSTMARKET_ROLLOVER_HOUR），撞到 report_exists 守衛就結束。
  schedule:
    # 台北 21:23 = UTC 13:23（同一天）
    # 融資餘額約 21:00 公布，排 21:23 可完整涵蓋
    # 若想改跑 16:00（融資會缺）：改成 "0 8 * * 1-5"
    - cron: "23 13 * * 1-5"
    # 備援：GitHub 高負載時會延遲 schedule，也可能整個丟掉不送 —— 2026-08-27
    # 盤前就是這樣,連一筆 run 記錄都沒有。台北 22:17,融資早就公布完,
    # 離午夜還有一段緩衝。第一次成功的話這次會在抓資料與 API 之前就結束
    # （見 main.py 的 report_exists 守衛），不花錢。
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "目標日期 YYYY-MM-DD（留空=今天）"
        required: false
      force:
        description: "報告已存在也重新產生（會再花一次 API 費用）"
        type: boolean
        default: false
      # 外部定時服務專用，手動觸發不要勾。勾了代表「這是一次排程」：
      # 報告已存在時跟排程一樣安靜結束，不會被當成手動補送而重發通知。
      scheduled:
        description: "由外部定時服務觸發（視同排程，手動觸發不要勾）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: postmarket
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 盤後正常約 5 分鐘（抓資料 2 分 + API 3 分），但 API latency 會浮動,
    # ETF 名單過期時還要多花最多 90 秒重抓。2026-10-14 就是卡在 10 分鐘被取消。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 測試失敗就中止，不浪費 API 費用去產生一份壞報告
      - name: 跑測試
        run: python -m unittest discover -s tests

      - name: 產生盤後籌碼分析
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
          TZ: Asia/Taipei
        run: |
          # 用陣列組參數：shell 是 bash -e，寫成 [ -n "$x" ] && ARGS=... 的話
          # 條件不成立會讓整個 step 以 exit 1 收場。
          ARGS=(--session postmarket)
          if [ -n "${{ inputs.target_date }}" ]; then ARGS+=(--date "${{ inputs.target_date }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS+=(--force); fi
          python -m premarket.main "${ARGS[@]}"

      - name: 推回 repo
        id: push
        run: |
          git config user.name  "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          # 先 commit 再 pull：此時 docs/ 已有剛產生的檔案,工作區不乾淨,
          # 在 commit 之前 rebase 會因為 unstaged changes 直接失敗。
          git add docs/
          git diff --staged --quiet || git commit -m "盤後籌碼分析 $(date +%Y-%m-%d)"
          git pull --rebase
          git push

      # Telegram 失敗警告。擺在兩個推播步驟之前：有步驟失敗之後，後面的步驟
      # 不會自動執行，這步是靠 failure()／cancelled() 自己跑起來的。放在 LINE
      # 之後的話，LINE 權杖過期（exit 1）也會被當成「報告沒發布」而誤報。
      - name: Telegram 失敗警告
        if: (failure() || cancelled()) && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 四種失敗的下一步不一樣，訊息要講對是哪一種 ——「程式掛了」和
          # 「超時被砍」在 Actions 上一樣紅，但前者要改程式、後者要調 timeout。
          GEN="${{ steps.gen.outcome }}"
          PUSH="${{ steps.push.outcome }}"
          if [ "$GEN" = "cancelled" ] || [ "$PUSH" = "cancelled" ]; then
            R="執行被中止（超過 timeout 或被手動取消），報告沒有發布。"
          elif [ "$GEN" = "failure" ]; then
            R="分析產出失敗，報告沒有發布。原因看執行紀錄最上方那行紅字。"
          elif [ "$GEN" = "skipped" ]; then
            R="測試沒過，這次刻意不產生報告（壞掉的程式不該產出報告）。"
          elif [ "$PUSH" = "failure" ]; then
            R="報告已產出，但推回 repo 失敗，網頁沒有更新。"
          else
            R="執行失敗，報告可能沒有發布。"
          fi
          # 用 python3 而非 python：這步可能在 setup-python／pip install 掛掉之後
          # 才執行。notify_telegram 只用標準庫，系統 python 就跑得起來。
          python3 -m premarket.notify_telegram --session postmarket --failure \
            --reason "$R" \
            --date "${{ steps.gen.outputs.report_date }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Telegram 推播。摘要（一句話總結 + 明日觀察重點）直接寫在訊息裡，手機通知欄
      # 就看得完，連結留給想看全文的時候。
      # 和 LINE 完全獨立：一邊的權杖過期不會擋住另一邊。
      # 條件看 push 的結果而不是 success()：要的是「報告真的上去了」。
      # 手動觸發時即使 gen 因「報告已存在」而略過，也重送最新一份（不花 API 費用）。
      # 外部定時服務（cron-job.org）也是走 workflow_dispatch，但帶 scheduled=true，
      # 要當成排程看待：報告已存在就不送，否則遲到的備援與外部觸發會各推一次。
      - name: Telegram 推播
        if: >-
          always() && steps.push.outcome == 'success' &&
          env.TELEGRAM_BOT_TOKEN != '' &&
          (steps.gen.outputs.skipped != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.scheduled))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          # 日期留空時腳本自己找最新一份 —— 手動補送走的就是這條。
          python3 -m premarket.notify_telegram --session postmarket \
            --date "${{ steps.gen.outputs.report_date }}"

      # LINE 通知。沒設 secret 的人（例如 fork 的人）自動略過，不會讓 workflow 失敗。
      # 用 broadcast 而非 push：不需要知道自己的 userId，發給所有加好友的人即可。
      # skipped 是備援排程那次：報告早就發過了，再廣播一次等於騷擾訂閱者。
      - name: LINE 通知
        id: line
        # 不再用 success()：Telegram 那步失敗（權杖過期會 exit 1）不該連帶
        # 讓 LINE 也不送。兩邊各自獨立，只看報告有沒有真的 push 上去。
        if: >-
          always() && steps.push.outcome == 'success' &&
          env.LINE_TOKEN != '' && steps.gen.outputs.skipped != 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          # 日期用報告本身的日期，不是執行當天 —— 補跑舊日期時兩者會差好幾天。
          # 取不到就退回今天（例如 main.py 還沒寫出這個 output 的舊版）。
          D="${{ steps.gen.outputs.report_date }}"
          if [ -n "$D" ]; then WHEN="${D:5:2}/${D:8:2}"; else WHEN="$(date +%m/%d)"; fi
          MSG="台股盤後籌碼 ${WHEN} 已更新
          ${PAGES_URL:-https://github.com/${{ github.repository }}}/latest-postmarket.html"
          # 發送、額度檢查、錯誤處理都在 tools/line_notify.py（三個 workflow 共用）。
          # 權杖失效或本月額度用完時它會讓這個 step 失敗，GitHub 就會寄錯誤信通知你。
          LINE_MESSAGE="$MSG" python -m tools.line_notify

      # LINE 掛掉時也要推 Telegram。tools/line_notify.py 在權杖失效或本月額度用完時
      # 會讓上一步失敗，好讓 GitHub 寄錯誤信 —— 但「紅字加一封沒人看的信」正是
      # 2026-10 金鑰過期連續失敗九個交易日沒被發現的那個組合。
      #
      # 跟前面那個「Telegram 失敗警告」是相反的情況，所以分成兩步：那步在報告
      # 沒發布時跑（它排在 LINE 之前，所以不會為了 LINE 失敗而誤報），這步相反 ——
      # 報告好端端發布了，只有 LINE 沒送出。--published 會把標題換成「通知有問題」，
      # 否則看到警告的第一個動作會是去翻今天的報告在不在，而該翻的是 LINE 後台。
      - name: Telegram 通知 LINE 失敗
        if: always() && steps.line.outcome == 'failure' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m premarket.notify_telegram --session postmarket --failure --published \
            --reason "LINE 通知沒送出：權杖失效，或本月的免費額度用完了。" \
            --date "${{ steps.gen.outputs.report_date }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

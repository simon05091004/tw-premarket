<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五、六年級游泳課時段選填</title>
<meta name="description" content="五、六年級各班線上選填游泳課時段，每班選三個時段，每格最多三個班，先選先得">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf8f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{
  --paper:#faf8f4; --card:#ffffff; --sunk:#f4f1ea;
  --ink:#1e1c19; --dim:#6d675e; --faint:#989185;
  --line:#e4dfd5; --hair:#efebe2; --hatch:#eae6dc;
  --a1:#a1670f; --a1-bg:#fbf3e2; --a1-ln:#e6d3a8;
  --a2:#1d5ba4; --a2-bg:#edf3fc; --a2-ln:#c3d7f0;
  --a3:#1c7549; --a3-bg:#eaf6ef; --a3-ln:#b5dcc4;
  --a4:#7a3f8c; --a4-bg:#f8eefb; --a4-ln:#dfc4e8;
  --warn:#9c3412; --warn-bg:#fbeee7;
  --focus:#1d5ba4;
  --sh:0 1px 2px rgba(40,32,18,.05), 0 6px 18px -10px rgba(40,32,18,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1a1815; --card:#232019; --sunk:#1f1c17;
    --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
    --line:#35312a; --hair:#2b2822; --hatch:#26231d;
    --a1:#e3a943; --a1-bg:#332a17; --a1-ln:#584825;
    --a2:#7db0ef; --a2-bg:#1a2634; --a2-ln:#2e4864;
    --a3:#5ec68e; --a3-bg:#172b20; --a3-ln:#2b543e;
    --a4:#cb99dc; --a4-bg:#2b1f31; --a4-ln:#4c3557;
    --warn:#f0a184; --warn-bg:#33211a;
    --focus:#7db0ef;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#1a1815; --card:#232019; --sunk:#1f1c17;
  --ink:#ece6dc; --dim:#a09789; --faint:#7b7366;
  --line:#35312a; --hair:#2b2822; --hatch:#26231d;
  --a1:#e3a943; --a1-bg:#332a17; --a1-ln:#584825;
  --a2:#7db0ef; --a2-bg:#1a2634; --a2-ln:#2e4864;
  --a3:#5ec68e; --a3-bg:#172b20; --a3-ln:#2b543e;
  --a4:#cb99dc; --a4-bg:#2b1f31; --a4-ln:#4c3557;
  --warn:#f0a184; --warn-bg:#33211a;
  --focus:#7db0ef;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.65 "Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}
.wrap{max-width:1040px;margin:0 auto;padding:36px 18px 72px;display:flex;flex-direction:column;gap:30px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{margin:0;font-size:12.5px;letter-spacing:.14em;color:var(--dim);font-weight:500}
h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(25px,4.4vw,34px);
  line-height:1.3;letter-spacing:.01em;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--dim);font-size:15px;max-width:62ch}
.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a3);flex:0 0 auto}
.dot.local{background:var(--a1)} .dot.bad{background:var(--warn)}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.panel-hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:18px 20px 0}
.panel-bd{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-family:"Noto Serif TC",serif;font-weight:600;font-size:19px;letter-spacing:.01em}
.kicker{font-size:11.5px;letter-spacing:.16em;color:var(--dim);font-weight:600;text-transform:uppercase}
.hint{margin:0;font-size:13.5px;color:var(--dim)}

/* ---------- class picker ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px 8px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;min-width:66px;transition:border-color .12s,background .12s,transform .08s}
.chip:hover{border-color:var(--dim)}
.chip:active{transform:translateY(1px)}
.chip .cn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.chip .pips{display:flex;gap:3px}
.chip .pip{width:5px;height:5px;border-radius:50%;background:var(--line)}
.chip .pip.on{background:var(--a3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .pip{background:rgba(255,255,255,.28)}
.chip[aria-pressed="true"] .pip.on{background:var(--a3)}

/* ---------- session grids ---------- */
.ses{--ac:var(--dim);--ac-bg:var(--sunk);--ac-ln:var(--line)}
.ses.s1{--ac:var(--a1);--ac-bg:var(--a1-bg);--ac-ln:var(--a1-ln)}
.ses.s2{--ac:var(--a2);--ac-bg:var(--a2-bg);--ac-ln:var(--a2-ln)}
.ses.s3{--ac:var(--a3);--ac-bg:var(--a3-bg);--ac-ln:var(--a3-ln)}
.ses.s4{--ac:var(--a4);--ac-bg:var(--a4-bg);--ac-ln:var(--a4-ln)}
.ses h2{color:var(--ac)}
.ses .kicker{color:var(--ac)}
.tally{margin-left:auto;font-size:13px;color:var(--dim)}
.tally b{color:var(--ink);font-weight:600}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:collapse;width:100%;min-width:420px}
table.grid th,table.grid td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:0}
table.grid tr:last-child th,table.grid tr:last-child td{border-bottom:0}
table.grid th:last-child,table.grid td:last-child{border-right:0}
table.grid thead th{background:var(--ac-bg);border-bottom:1px solid var(--ac-ln);padding:11px 8px;
  text-align:center;font-weight:600}
thead .d{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;color:var(--ac);display:block;font-variant-numeric:tabular-nums}
thead .w{font-size:11.5px;color:var(--dim);display:block;margin-top:1px;font-weight:500}
thead th.rh{background:var(--sunk);color:var(--dim);font-size:12px;letter-spacing:.08em;width:104px;min-width:104px}
th.rh{background:var(--sunk);text-align:center;padding:8px 6px;width:104px;min-width:104px}
th.rh .pn{display:block;font-size:13.5px;font-weight:600}
th.rh .pt{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);margin-top:1px}
td.slot{padding:5px;vertical-align:top}
td.blocked{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--hatch) 5px,var(--hatch) 6px);
  text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.05em}
.cell{display:flex;flex-direction:column;gap:4px}
.seat{appearance:none;width:100%;border-radius:8px;padding:7px 4px;cursor:pointer;font:inherit;
  font-size:14px;line-height:1.25;transition:border-color .12s,background .12s,color .12s;text-align:center}
.seat.open{background:transparent;border:1px dashed var(--line);color:var(--faint);font-size:12px}
.seat.open:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-bg)}
.seat.taken{background:var(--ac-bg);border:1px solid var(--ac-ln);color:var(--ac);
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;cursor:default}
.seat.mine{background:var(--ac);border-color:var(--ac);color:var(--card);cursor:pointer}
:root[data-theme="dark"] .seat.mine{color:#17150f}
.seat.mine:hover{filter:brightness(1.06)}
.seat.mine::after{content:" ✕";font-size:11px;opacity:.7}
.seat:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.grp{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.grp:last-child{margin-bottom:0}
.grpname{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:600}
.badge{align-self:center;font-size:9.5px;letter-spacing:.02em;color:var(--ac);
  background:var(--ac-bg);border:1px solid var(--ac-ln);border-radius:999px;padding:0 6px;line-height:15px;
  white-space:nowrap;margin-bottom:1px}
th.rh .pt2{display:block;font-size:9.5px;color:var(--faint);margin-top:1px;line-height:1.3}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn);opacity:.9;margin:1px 0 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* ---------- summary ---------- */
table.sum{width:100%;border-collapse:collapse;font-size:14px}
table.sum th,table.sum td{padding:9px 10px;border-bottom:1px solid var(--hair);text-align:left}
table.sum thead th{font-size:12px;letter-spacing:.06em;color:var(--dim);font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.sum tbody tr:last-child td{border-bottom:0}
table.sum td.cls{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;width:64px}
table.sum td.none{color:var(--warn)}
table.sum td em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.sumwrap{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;opacity:.85}
.t1{color:var(--a1)} .t2{color:var(--a2)} .t3{color:var(--a3)} .t4{color:var(--a4)}

/* ---------- buttons ---------- */
.actions{display:flex;gap:9px;flex-wrap:wrap;padding-top:2px}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 16px;
  cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  transition:opacity .12s,transform .08s}
.btn:hover{opacity:.87} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--dim);opacity:1}
.btn.danger{background:transparent;color:var(--warn);border-color:var(--warn);opacity:.75}
.btn.danger:hover{opacity:1}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);z-index:50;
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:11px;font-size:14px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:min(88vw,460px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--faint);font-size:12.5px;text-align:center;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .wrap{padding:24px 12px 60px;gap:22px}
  .panel-hd{padding:15px 14px 0} .panel-bd{padding:13px 14px 16px}
  th.rh,thead th.rh{width:82px;min-width:82px}
  .seat{font-size:13px}
}
@media print{
  body{background:#fff}
  .panel{box-shadow:none;break-inside:avoid}
  .noprint,.actions,#toast,.chips,.seat.open{display:none!important}
  .wrap{max-width:none;padding:0;gap:16px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow" id="hdEyebrow"></p>
    <h1 id="hdTitle"></h1>
    <p class="lede" id="hdLede"></p>
    <div class="syncbar"><span class="dot" id="syncDot"></span><span id="syncText">載入中…</span></div>
  </header>

  <section class="panel noprint" id="whoPanel">
    <div class="panel-hd"><span class="kicker">第一步</span><h2>選擇你的班級</h2></div>
    <div class="panel-bd">
      <div class="chips" id="classChips"></div>
      <p class="hint" id="whoHint"></p>
      <div class="actions"><button class="btn ghost" id="btnMine" type="button" disabled>複製我的選擇</button></div>
    </div>
  </section>

  <div id="sessions" style="display:flex;flex-direction:column;gap:30px"></div>

  <section class="panel">
    <div class="panel-hd"><span class="kicker">總覽</span><h2>各班選填結果</h2>
      <span class="tally" id="sumTally"></span></div>
    <div class="panel-bd">
      <div class="sumwrap"><table class="sum" id="sumTable"></table></div>
      <div class="actions noprint">
        <button class="btn" id="btnXlsx">匯出 Excel</button>
        <button class="btn" id="btnPdf">匯出 PDF</button>
        <button class="btn ghost" id="btnCsv">匯出 CSV</button>
        <button class="btn ghost" id="btnPrint">列印</button>
        <button class="btn danger" id="btnReset">清除全部</button>
      </div>
    </div>
  </section>

  <footer>
    <span id="stamp"></span><br>
    <span id="hdDates"></span>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   設定：改這一區就好
   open 陣列 = 該日開放的節次 id（沒列到的就是不排）
   ============================================================ */
const CFG = {
  school: "永福國小",
  term: "115 學年度第一學期",
  grade: "五、六年級",
  title: "五、六年級游泳課時段選填",
  shareTitle: "游泳課選填入口",
  itemLabel: "週次",
  perCell: 4,              /* 每格最多幾個班 */
  picksPerClass: 3,        /* 每個班要選幾個時段（每班游三次） */
  groups: [                /* 班級分組，只影響第一步的排版 */
    {name:"五年級", count:11},
    {name:"六年級", count:11}
  ],
  classes: ["501","502","503","504","505","506","507","508","509","510","511",
            "601","602","603","604","605","606","607","608","609","610","611"],
  periods: [
    {id:"m1", name:"上午（一）", time:"08:20–10:30", note:"上課 08:50–10:00"},
    {id:"m2", name:"上午（二）", time:"09:50–12:00", note:"上課 10:20–11:30"},
    {id:"a1", name:"下午（一）", time:"12:30–14:40", note:"上課 13:00–14:10"},
    {id:"a2", name:"下午（二）", time:"13:50–16:00", note:"上課 14:20–15:30"}
  ],
  sessions: [
    {id:"w1", name:"第一週", month:"10/5 – 10/8", tone:1, days:[
      {id:"1005", date:"10/5",  wd:"星期一", open:["m1","m2"]},
      {id:"1006", date:"10/6",  wd:"星期二", open:["m1","a1","a2"]},
      {id:"1007", date:"10/7",  wd:"星期三", open:[]},
      {id:"1008", date:"10/8",  wd:"星期四", open:["m1","m2","a1","a2"]}
    ]},
    {id:"w2", name:"第二週", month:"10/12 – 10/15", tone:2, days:[
      {id:"1012", date:"10/12", wd:"星期一", open:["m1","m2","a1","a2"]},
      {id:"1013", date:"10/13", wd:"星期二", open:["m1","a1","a2"]},
      {id:"1014", date:"10/14", wd:"星期三", open:[]},
      {id:"1015", date:"10/15", wd:"星期四", open:[]}
    ]},
    {id:"w3", name:"第三週", month:"10/19 – 10/22", tone:3, days:[
      {id:"1019", date:"10/19", wd:"星期一", open:["m1","m2","a1","a2"]},
      {id:"1020", date:"10/20", wd:"星期二", open:["m1","a1","a2"]},
      {id:"1021", date:"10/21", wd:"星期三", open:[]},
      {id:"1022", date:"10/22", wd:"星期四", open:[]}
    ]},
    {id:"w4", name:"第四週", month:"10/26 – 10/29", tone:4, days:[
      {id:"1026", date:"10/26", wd:"星期一", open:[]},
      {id:"1027", date:"10/27", wd:"星期二", open:["m1","m2","a1","a2"]},
      {id:"1028", date:"10/28", wd:"星期三", open:["m1"]},
      {id:"1029", date:"10/29", wd:"星期四", open:[]}
    ]}
  ],
  /* 額外限制：符合 wd + periods 的格子視為同一組，每個班合計最多 max 次 */
  limits: [
    {id:"tueAft", label:"週二下午限 1 次", max:1, wd:"星期二", periods:["a1","a2"],
     msg:"週二的下午（一）、下午（二），每個班合計只能選 1 次"}
  ],
  /* 額外說明，會列在標頭與分享頁 */
  notes: ["同一時段若已有 4 個班，將以抽籤或協調方式解決"],
  coordinateAt: 4         /* 一格累積到幾個班就亮出「需抽籤或協調」 */
};
const LS_KEY = "yfes-swim-115-1";
const LS_ME  = "yfes-swim-115-1-me";

/* ============================================================
   狀態
   ============================================================ */
let state = { picks:{}, updated:null };
let me = null;
const P = id => CFG.periods.find(p => p.id === id);
const DAY = id => {
  for(let i = 0; i < CFG.sessions.length; i++){
    const d = CFG.sessions[i].days.find(x => x.id === id);
    if(d) return {ses:CFG.sessions[i], day:d};
  }
  return null;
};
const key = (dayId, pid) => dayId + "/" + pid;
const MAXPICK = CFG.picksPerClass || 1;
const NUM = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
const nWeeks = () => (NUM[CFG.sessions.length] || CFG.sessions.length) + "週";
/** 時段的先後順序，用來把某班的三個選擇排成第一次／第二次／第三次 */
const ORD = (() => {
  const m = {}; let i = 0;
  CFG.sessions.forEach(ses => ses.days.forEach(d => CFG.periods.forEach(p => { m[key(d.id, p.id)] = i++; })));
  return m;
})();

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.picks) state = d; }
    me = localStorage.getItem(LS_ME) || null;
  }catch(e){}
  if(!CFG.classes.includes(me)) me = null;
}
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    if(me) localStorage.setItem(LS_ME, me);
  }catch(e){}
}
/** 一個班的選擇是一個 key 陣列，最多 MAXPICK 個 */
function picksOf(cls, map){
  const v = (map || state.picks)[cls];
  return Array.isArray(v) ? v : [];
}
function sortedPicks(cls, map){
  return picksOf(cls, map).slice().sort((a, b) => (ORD[a] == null ? 1e9 : ORD[a]) - (ORD[b] == null ? 1e9 : ORD[b]));
}
function hasPick(cls, k, map){ return picksOf(cls, map).indexOf(k) >= 0; }
function occupants(k, map){ return CFG.classes.filter(c => hasPick(c, k, map)); }
function doneCount(cls, map){ return picksOf(cls, map).length; }
/** 這一格屬於哪一條額外限制（例如週二下午） */
function limitOf(k){
  const parts = k.split("/"), t = DAY(parts[0]);
  if(!t) return null;
  const L = (CFG.limits || []).find(x => x.wd === t.day.wd && x.periods.indexOf(parts[1]) >= 0);
  return L || null;
}
/** 某班已經用掉這條限制幾次 */
function limitUsed(cls, lim, map){
  return picksOf(cls, map).filter(k => { const L = limitOf(k); return L && L.id === lim.id; }).length;
}
function slotLabel(k){
  if(!k) return null;
  const parts = k.split("/"), t = DAY(parts[0]), p = P(parts[1]);
  if(!t || !p) return null;
  const d = t.day;
  return { date:d.date, wd:d.wd, period:p.name, time:p.time, ses:t.ses,
           text: d.date + "（" + d.wd.slice(-1) + "）" + p.name,
           full: d.date + "（" + d.wd.slice(-1) + "）" + p.name + " " + p.time };
}

/* ============================================================

function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = false;
    s.onload = res;
    s.onerror = () => rej(new Error("script " + src));
    document.head.appendChild(s);
  });
}
async function initFirebase(){
  SYNC.mode = "connecting"; renderSync();
  try{
    await loadScript(FIRE_SDK + "firebase-app-compat.js");
    await loadScript(FIRE_SDK + "firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.db = firebase.firestore();
    SYNC.ref = SYNC.db.collection(FIRE_COL).doc(FIRE_ID);
    SYNC.unsub = SYNC.ref.onSnapshot(
      snap => {
        const d = snap.exists ? (snap.data() || {}) : null;
        state = { picks:(d && d.picks) || {}, updated:(d && d.updated) || null };
        SYNC.mode = "fire"; SYNC.note = ""; SYNC.pending = false;
        saveLocal(); renderAll();
      },

          ? "Firestore 規則尚未開放 " + FIRE_COL + "，選擇僅存在這台裝置"

/** 交易內重做容量檢查 — 兩個班同時點同一格時，先選先得才擋得住 */
function fireCommit(mutate){
  return SYNC.db.runTransaction(async t => {
    const snap = await t.get(SYNC.ref);
    const d = snap.exists ? (snap.data() || {}) : {};
    const picks = d.picks ? JSON.parse(JSON.stringify(d.picks)) : {};
    mutate(picks);
    t.set(SYNC.ref, { picks:picks, updated:new Date().toISOString(), v:1 });
  });
}
/** 所有異動都走這裡：fire 模式進交易，其餘就地套用 */
async function commit(mutate){
  if(SYNC.mode === "fire"){
    SYNC.pending = true; renderSync();
    try{
      await fireCommit(mutate);
      SYNC.pending = false; SYNC.note = ""; renderSync();
      return true;                      /* onSnapshot 會帶回最新結果並重繪 */
    }catch(e){
      SYNC.pending = false;
      if(e && e.code === "FULL"){ toast("這個時段剛剛被別班選走了"); renderSync(); return false; }
      if(e && e.code === "MAX"){ toast("這個班已經選滿 " + MAXPICK + " 個時段"); renderSync(); return false; }
      if(e && e.code === "LIMIT"){ toast(e.msg || "超過選填限制"); renderSync(); return false; }
      SYNC.note = "儲存失敗，請再試一次"; renderSync();
      clearTimeout(SYNC.timer);
      SYNC.timer = setTimeout(() => { SYNC.note = ""; renderSync(); }, 3200);
      return false;
    }
  }
  try{ mutate(state.picks); }
  catch(e){
    if(e && e.code === "FULL"){ toast("這個時段已經滿 " + CFG.perCell + " 班了"); renderAll(); return false; }
    if(e && e.code === "MAX"){ toast("這個班已經選滿 " + MAXPICK + " 個時段"); renderAll(); return false; }
    if(e && e.code === "LIMIT"){ toast(e.msg || "超過選填限制"); renderAll(); return false; }
    throw e;
  }
  state.updated = new Date().toISOString();
  saveLocal(); queuePush(); renderAll();
  return true;
}
function queuePush(){
  if(SYNC.mode !== "shared" || !SYNC.api) return;
  SYNC.pending = true; renderSync();
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(push, 700);
}
async function push(){
  if(!SYNC.api) return;
  try{
    await SYNC.api.publish({ "data/picks.json": JSON.stringify(state) });
    SYNC.pending = false; SYNC.note = ""; renderSync();
  }catch(e){
    const c = e && e.code;
    SYNC.pending = false;
    if(c === "conflict"){
      SYNC.note = "剛才有人同時送出，正在載入最新版…";
      renderSync(); setTimeout(() => location.reload(), 900);
    }else if(c === "rate_limited"){
      SYNC.note = "儲存太頻繁，稍候再試"; renderSync();
      clearTimeout(SYNC.timer); SYNC.timer = setTimeout(push, 4000);
    }else{
      SYNC.mode = "local";
      SYNC.note = (c === "not_writer" || c === "not_granted")
        ? "你只有檢視權限，選擇僅存在這台裝置，請把結果回報給負責人"
        : "共用儲存無法使用，選擇僅存在這台裝置";
      renderSync();
    }
  }
}

async function addPick(k){
  if(!me){
    toast("請先在上面選擇你的班級");
    document.getElementById("whoPanel").scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  const cls = me, lim = limitOf(k), before = doneCount(cls);
  if(doneCount(cls) >= MAXPICK){ toast(cls + " 班已經選滿 " + MAXPICK + " 個時段，先取消一個再選"); return; }
  if(lim && limitUsed(cls, lim) >= lim.max){ toast(lim.msg); return; }
  const ok = await commit(picks => {
    /* 交易內重做所有檢查 —— 兩個班同時點同一格時，先選先得才擋得住 */
    const mine = Array.isArray(picks[cls]) ? picks[cls].slice() : [];
    if(mine.indexOf(k) >= 0) return;
    if(mine.length >= MAXPICK){ const e = new Error("max"); e.code = "MAX"; throw e; }
    if(lim){
      const used = mine.filter(x => { const L = limitOf(x); return L && L.id === lim.id; }).length;
      if(used >= lim.max){ const e = new Error("limit"); e.code = "LIMIT"; e.msg = lim.msg; throw e; }
    }
    const taken = Object.keys(picks).filter(c => c !== cls && Array.isArray(picks[c]) && picks[c].indexOf(k) >= 0);
    if(taken.length >= CFG.perCell){ const e = new Error("full"); e.code = "FULL"; throw e; }
    mine.push(k);
    picks[cls] = mine;
  });
  if(!ok) return;
  const L = slotLabel(k);
  toast(cls + " 班選定 " + L.text + "（" + Math.min(before + 1, MAXPICK) + " / " + MAXPICK + "）");
}
async function dropPick(cls, k){
  const ok = await commit(picks => {
    const mine = Array.isArray(picks[cls]) ? picks[cls].filter(x => x !== k) : [];
    if(mine.length) picks[cls] = mine; else delete picks[cls];
  });
  if(!ok) return;
  const L = slotLabel(k);
  toast(cls + " 班已取消 " + (L ? L.text : "該時段"));
}

/* ---------- ZIP (store) + XLSX ---------- */
const CRCT = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder(), chunks = [], dir = [];
  const now = new Date();
  const dosT = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosD = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = (typeof f.data === "string") ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const h = new Uint8Array(30 + name.length), v = new DataView(h.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true);
    v.setUint16(8, 0, true); v.setUint16(10, dosT, true); v.setUint16(12, dosD, true);
    v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
    v.setUint16(26, name.length, true); v.setUint16(28, 0, true);
    h.set(name, 30);
    chunks.push(h, data);
    dir.push({name:name, crc:crc, size:data.length, off:off, t:dosT, d:dosD});
    off += h.length + data.length;
  });
  const cdStart = off;
  dir.forEach(c => {
    const h = new Uint8Array(46 + c.name.length), v = new DataView(h.buffer);
    v.setUint32(0, 0x02014b50, true); v.setUint16(4, 20, true); v.setUint16(6, 20, true);
    v.setUint16(8, 0x0800, true); v.setUint16(10, 0, true);
    v.setUint16(12, c.t, true); v.setUint16(14, c.d, true);
    v.setUint32(16, c.crc, true); v.setUint32(20, c.size, true); v.setUint32(24, c.size, true);
    v.setUint16(28, c.name.length, true); v.setUint16(30, 0, true); v.setUint16(32, 0, true);
    v.setUint16(34, 0, true); v.setUint16(36, 0, true); v.setUint32(38, 0, true);
    v.setUint32(42, c.off, true);
    h.set(c.name, 46);
    chunks.push(h); off += h.length;
  });
  const e = new Uint8Array(22), ev = new DataView(e.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, dir.length, true); ev.setUint16(10, dir.length, true);
  ev.setUint32(12, off - cdStart, true); ev.setUint32(16, cdStart, true); ev.setUint16(20, 0, true);
  chunks.push(e); off += 22;
  const out = new Uint8Array(off);
  let p = 0;
  chunks.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}
const xe = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")

const colName = n => { let s = ""; n++; while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; } return s; };
/** rows: [[{v,s}|null,...],...]  s = cellXfs index */
function sheetXml(rows, cols, merges, heights){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(cols && cols.length){
    x += "<cols>";
    cols.forEach(c => { x += '<col min="' + c.min + '" max="' + c.max + '" width="' + c.w + '" customWidth="1"/>'; });
    x += "</cols>";
  }
  x += "<sheetData>";
  rows.forEach((row, ri) => {
    const h = heights && heights[ri];
    x += '<row r="' + (ri + 1) + '"' + (h ? ' ht="' + h + '" customHeight="1"' : "") + ">";
    row.forEach((cell, ci) => {
      if(cell == null) return;
      const ref = colName(ci) + (ri + 1);
      const s = cell.s ? ' s="' + cell.s + '"' : "";
      if(cell.v === "" || cell.v == null){ x += '<c r="' + ref + '"' + s + "/>"; }
      else { x += '<c r="' + ref + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xe(cell.v) + "</t></is></c>"; }
    });
    x += "</row>";
  });
  x += "</sheetData>";
  if(merges && merges.length){
    x += '<mergeCells count="' + merges.length + '">';
    merges.forEach(m => { x += '<mergeCell ref="' + m + '"/>'; });
    x += "</mergeCells>";
  }
  x += "</worksheet>";
  return x;
}

  CFG.periods.forEach(p => {

      const occ = gridCell(x.day, p);
      row.push(occ === null ? "—" : occ.join("、"));
    });
    lines.push(row.map(q).join(","));
  });
  lines.push("");
  lines.push([CFG.grade + "各班選填"].map(q).join(","));

  return "﻿" + lines.join("\r\n") + "\r\n";

/* ---------- 畫成 A4 橫式表格 → PDF ---------- */
const PC = { ink:"#1e1c19", dim:"#6d675e", faint:"#a9a297", line:"#c9c3b8", hair:"#ded8cd",
             head:"#f4f2ec", rowh:"#faf9f6", block:"#f2f0ea",
             tone:{1:{fg:"#8f5a0b",bg:"#fbf3e2"}, 2:{fg:"#1a5296",bg:"#edf3fc"}, 3:{fg:"#186640",bg:"#eaf6ef"},
                   4:{fg:"#6e3880",bg:"#f8eefb"}} };
const FS = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const FM = '"IBM Plex Mono",ui-monospace,Menlo,monospace';

function renderSheetCanvas(scale){
  const days = allDays();
  const PAD = 28, C0 = 158, CW = 112, HT = 86, H1 = 54, H2 = 34, RH = 72, FT = 28;
  const tableW = C0 + days.length * CW;
  const W = tableW + PAD * 2;
  const top = PAD + HT;
  const tableH = H1 + H2 + CFG.periods.length * RH;
  const H = top + tableH + FT + PAD;

  const cv = document.createElement("canvas");
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const g = cv.getContext("2d");
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
  g.textBaseline = "middle";

  const txt = (s, x, y, font, color, align) => {
    g.font = font; g.fillStyle = color; g.textAlign = align || "center";
    g.fillText(s, x, y);
  };
  const box = (x, y, w, h, fill) => { if(fill){ g.fillStyle = fill; g.fillRect(x, y, w, h); } };
  const line = (x1, y1, x2, y2, color, lw) => {
    g.strokeStyle = color; g.lineWidth = lw || 1;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  };

  /* 標題 */
  txt(sheetTitle(), W / 2, PAD + 24, '700 23px ' + FS, PC.ink);
  txt("每班選 " + MAXPICK + " 個時段　·　每個時段最多 " + CFG.perCell + " 個班　·　產出時間 " + fmtStamp(new Date()),
      W / 2, PAD + 54, '400 12.5px ' + FS, PC.dim);

  const cx = i => PAD + C0 + i * CW;

  /* 表頭：日期 */
  box(PAD, top, C0, H1, PC.head);
  txt("節次 / 時間", PAD + C0 / 2, top + H1 / 2, '600 12.5px ' + FS, PC.dim);
  days.forEach((x, i) => {
    const t = PC.tone[x.ses.tone];
    box(cx(i), top, CW, H1, t.bg);
    txt(x.day.date, cx(i) + CW / 2, top + 20, '600 19px ' + FM, t.fg);
    txt(x.day.wd, cx(i) + CW / 2, top + 39, '500 11.5px ' + FS, PC.dim);
  });
  /* 表頭：項目 */
  const y2 = top + H1;
  box(PAD, y2, C0, H2, PC.head);
  txt(itemLabel(), PAD + C0 / 2, y2 + H2 / 2, '600 12.5px ' + FS, PC.dim);
  days.forEach((x, i) => {
    const t = PC.tone[x.ses.tone];
    box(cx(i), y2, CW, H2, t.bg);
    txt(x.ses.name, cx(i) + CW / 2, y2 + H2 / 2, '700 15px ' + FS, t.fg);
  });

  /* 節次列 */
  const rowY = r => y2 + H2 + r * RH;
  CFG.periods.forEach((p, r) => {
    const y = rowY(r);
    box(PAD, y, C0, RH, PC.rowh);
    txt(p.name, PAD + C0 / 2, y + RH / 2 - 12, '600 14.5px ' + FS, PC.ink);
    txt(p.time, PAD + C0 / 2, y + RH / 2 + 5, '400 11px ' + FM, PC.dim);
    if(p.note) txt(p.note, PAD + C0 / 2, y + RH / 2 + 20, '400 10px ' + FS, PC.faint);
    days.forEach((x, i) => {
      const occ = gridCell(x.day, p);
      if(occ === null){
        box(cx(i), y, CW, RH, PC.block);
        txt("—", cx(i) + CW / 2, y + RH / 2, '400 14px ' + FS, PC.faint);
        return;
      }
      /* 一格最多四個班，依數量決定字級與行距 */
      const n = occ.length;
      const spec = n <= 1 ? {f:19, gap:0} : n === 2 ? {f:17, gap:22} : n === 3 ? {f:15.5, gap:17} : {f:14, gap:15};
      for(let j = 0; j < n; j++){
        const off = spec.gap ? (j - (n - 1) / 2) * spec.gap : 0;
        txt(occ[j], cx(i) + CW / 2, y + RH / 2 + off, '600 ' + spec.f + 'px ' + FM, PC.ink);
      }
    });
  });

  /* 格線 */
  for(let r = 0; r <= CFG.periods.length; r++){
    const y = rowY(r);
    line(PAD, y, PAD + tableW, y, PC.hair);
  }
  line(PAD, y2, PAD + tableW, y2, PC.line);
  line(PAD, y2 + H2, PAD + tableW, y2 + H2, PC.line);
  for(let i = 0; i <= days.length; i++){
    const x = cx(i);
    line(x, top, x, top + tableH, i === 0 ? PC.line : PC.hair);
  }
  g.strokeStyle = PC.line; g.lineWidth = 1.4;
  g.strokeRect(PAD, top, tableW, tableH);

  /* 頁尾 */
  const missing = CFG.classes.filter(c => doneCount(c) < MAXPICK);
  txt(missing.length ? "尚未選滿 " + MAXPICK + " 個時段：" + missing.join("、") : "全部 " + CFG.classes.length + " 班皆已選滿 " + MAXPICK + " 個時段",
      W / 2, top + tableH + 17, '400 11.5px ' + FS, missing.length ? "#9c3412" : PC.dim);

  return cv;
}

async function canvasImage(cv){
  try{
    if(typeof CompressionStream === "function"){
      const px = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      const rgb = new Uint8Array(cv.width * cv.height * 3);
      for(let i = 0, j = 0; i < px.length; i += 4){ rgb[j++] = px[i]; rgb[j++] = px[i+1]; rgb[j++] = px[i+2]; }
      const st = new Blob([rgb]).stream().pipeThrough(new CompressionStream("deflate"));
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      return {data:buf, filter:"/FlateDecode"};
    }
  }catch(e){}
  const b64 = cv.toDataURL("image/jpeg", 0.95).split(",")[1];
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return {data:u, filter:"/DCTDecode"};
}

async function buildPdf(){
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const cv = renderSheetCanvas(3);
  const img = await canvasImage(cv);
  const PW = 842, PH = 595, M = 20;
  const s = Math.min((PW - 2*M) / cv.width, (PH - 2*M) / cv.height);
  const w = cv.width * s, h = cv.height * s, x = (PW - w) / 2, y = (PH - h) / 2;
  const content = "q " + w.toFixed(2) + " 0 0 " + h.toFixed(2) + " " + x.toFixed(2) + " " + y.toFixed(2) + " cm /Im0 Do Q\n";

  const parts = []; let len = 0;
  const lat = str => { const a = new Uint8Array(str.length); for(let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 0xFF; return a; };
  const put = u8 => { parts.push(u8); len += u8.length; };
  const off = [0];
  put(lat("%PDF-1.4\n%âãÏÓ\n"));
  const obj = (n, head, stream) => {
    off[n] = len;
    put(lat(n + " 0 obj\n" + head + "\n"));
    if(stream){ put(lat("stream\n")); put(stream); put(lat("\nendstream\n")); }
    put(lat("endobj\n"));
  };
  const enc = new TextEncoder();
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
  obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "]"
       + " /Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>");
  const cs = enc.encode(content);
  obj(4, "<< /Length " + cs.length + " >>", cs);
  obj(5, "<< /Type /XObject /Subtype /Image /Width " + cv.width + " /Height " + cv.height
       + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter " + img.filter
       + " /Length " + img.data.length + " >>", img.data);
  const xref = len;
  let x2 = "xref\n0 6\n0000000000 65535 f \n";
  for(let i = 1; i <= 5; i++) x2 += String(off[i]).padStart(10, "0") + " 00000 n \n";
  x2 += "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
  put(lat(x2));
  const out = new Uint8Array(len);
  let p = 0; parts.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

async function offer(filename, data, mime){

    try{ await DL.save({filename:filename, data:data}); toast("已儲存 " + filename); return true; }
    catch(e){
      const c = e && e.code;
      if(c === "declined") return false;
      if(c === "rejected_extension" || c === "extension_not_enabled"){
        toast("這個檢視不允許下載 ." + filename.split(".").pop() + "，請改用其他格式");
        return false;
      }
      if(c !== "unavailable" && c !== "not_granted" && c !== "capability_disabled" && c !== "capability_removed"){
        toast("下載失敗：" + (e.message || c)); return false;
      }
    }
  }
  try{
    const blob = new Blob([data], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast("已下載 " + filename);
    return true;
  }catch(e){ toast("下載失敗：" + e.message); return false; }
}

/* ============================================================
   啟動
   ============================================================ */
function wire(){
  document.getElementById("btnXlsx").addEventListener("click", async ev => {
    const b = ev.currentTarget; b.disabled = true;
    try{
      await offer(fileBase() + "_" + fileStamp() + ".xlsx", buildXlsx(),
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    }finally{ b.disabled = false; }
  });
  document.getElementById("btnCsv").addEventListener("click", async ev => {
    const b = ev.currentTarget; b.disabled = true;
    try{ await offer(fileBase() + "_" + fileStamp() + ".csv", buildCsv(), "text/csv;charset=utf-8"); }
    finally{ b.disabled = false; }
  });
  document.getElementById("btnPdf").addEventListener("click", async ev => {
    const b = ev.currentTarget; const t = b.textContent;
    b.disabled = true; b.textContent = "產生中…";
    try{ await offer(fileBase() + "_" + fileStamp() + ".pdf", await buildPdf(), "application/pdf"); }
    catch(e){ toast("PDF 產生失敗：" + e.message); }
    finally{ b.disabled = false; b.textContent = t; }
  });
  document.getElementById("btnMine").addEventListener("click", async () => {
    if(!me) return;
    const txt = myPickText(me);
    try{
      if(navigator.share){ await navigator.share({title:me + " 班　" + CFG.title, text:txt}); return; }
      await navigator.clipboard.writeText(txt);
      toast(me + " 班的選擇已複製，可貼到導師群組");
    }catch(e){
      if(e && e.name === "AbortError") return;
      try{ await navigator.clipboard.writeText(txt); toast(me + " 班的選擇已複製"); }
      catch(e2){ toast("複製失敗，請手動抄錄"); }
    }
  });
  document.getElementById("btnPrint").addEventListener("click", () => { try{ window.print(); }catch(e){ toast("此檢視無法直接列印，請改用匯出 PDF"); } });
  const rb = document.getElementById("btnReset");
  rb.addEventListener("click", () => {
    if(rb.dataset.armed !== "1"){
      rb.dataset.armed = "1"; rb.textContent = "再按一次確認清除";
      clearTimeout(rb._t);
      rb._t = setTimeout(() => { rb.dataset.armed = "0"; rb.textContent = "清除全部"; }, 4000);
      return;
    }
    clearTimeout(rb._t); rb.dataset.armed = "0"; rb.textContent = "清除全部";
    commit(picks => { Object.keys(picks).forEach(k => { delete picks[k]; }); })
      .then(ok => { if(ok) toast("已清除所有班級的選填"); });
  });
}

loadLocal();
renderAll();
wire();
initRuntime();
</script>
<!--
  ═══════════════════════════════════════════════════════════════
  開啟即時共用（可選）

  1. 上面的 FIREBASE_CONFIG 填入 Firebase 專案設定
     （主控台 → 專案設定 → 一般 → 網頁應用程式 → firebaseConfig）
  2. Firestore → 規則，把下面這段「加進」現有規則最外層的
       match /databases/{database}/documents { … }
     大括號裡，其他既有 match 區塊原封不動保留。
     Firestore 規則逐路徑判斷、預設全部拒絕，所以新增這段
     不會影響同一專案裡其他集合的權限。

      match /swimSignup/{docId} {
        allow read:  if docId == '115-1';
        allow write: if docId == '115-1'
          && request.resource.data.keys().hasOnly(['picks', 'updated', 'v'])
          && request.resource.data.picks is map
          && request.resource.data.picks.size() <= 40
          && request.resource.data.updated is string
          && request.resource.data.updated.size() <= 40;
      }

  兩處的 swimSignup / 115-1 要和程式裡的 FIRE_COL / FIRE_ID 一致。
  畢業照選填用的是 photoSignup，兩段規則各自獨立、互不影響。
  每辦一次新的活動就換一個 FIRE_ID（例如 115-2），規則跟著改，
  舊資料就會留在原本的文件裡不被覆蓋。

  這份文件是公開可寫的（掃 QR 的人不需登入）。規則把範圍鎖在單一
  文件、40 筆以內、只有 picks/updated/v 三個欄位，就算有人亂寫，
  影響也只限於這張選填表，隨時可按「清除全部」重來。
  刪掉那段 match 即可關閉即時共用。
  ═══════════════════════════════════════════════════════════════
